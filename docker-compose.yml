services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: geotrack_db
    environment:
      POSTGRES_DB: geotrack_db
      POSTGRES_USER: geotrack
      POSTGRES_PASSWORD: geotrack
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geotrack -d geotrack_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: geotrack_backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geotrack_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://geotrack:geotrack@postgis:5432/geotrack_db
      SYNC_DATABASE_URL: postgresql://geotrack:geotrack@postgis:5432/geotrack_db
    env_file:
      - ./backend/.env
    depends_on:
      postgis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data_pipeline/data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  frontend:
    image: geotrack_frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: geotrack_frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    restart: unless-stopped

volumes:
  postgis_data:
    driver: local
